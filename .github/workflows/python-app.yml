name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Compile
        run: python -m compileall -q shared services tests
      - name: Lint
        run: ruff check shared services tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax
        run: find frontend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend tests
        run: node --test frontend/tests/*.test.mjs
