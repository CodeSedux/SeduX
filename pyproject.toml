[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedux"
version = "0.1.0"
description = "SeduX assistant control-plane foundation"
requires-python = ">=3.10"
dependencies = [
	"fastapi==0.141.1",
	"uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
	"httpx==0.28.1",
	"ruff==0.12.11",
]
postgres = ["psycopg[binary]==3.2.9"]
redis = ["redis==6.4.0"]
gpu = ["torch==2.8.0"]
cloud = []

[tool.setuptools.packages.find]
include = ["services*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120